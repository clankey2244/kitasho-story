 function pad(canvas,cross=false,onchange=()=>{}){
  const ctx=canvas.getContext('2d');let strokes=[],active=null;canvas.width=600;canvas.height=600;
  function draw(){ctx.clearRect(0,0,600,600);ctx.fillStyle='#fffefa';ctx.fillRect(0,0,600,600);if(cross){ctx.strokeStyle='#c8d8de';ctx.lineWidth=2;ctx.setLineDash([12,10]);ctx.beginPath();ctx.moveTo(300,0);ctx.lineTo(300,600);ctx.moveTo(0,300);ctx.lineTo(600,300);ctx.stroke();ctx.setLineDash([]);}ctx.strokeStyle='#294536';ctx.lineWidth=6;ctx.lineCap='round';ctx.lineJoin='round';for(const s of strokes){ctx.beginPath();s.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();}}
  const point=e=>{const r=canvas.getBoundingClientRect();return[(e.clientX-r.left)/r.width*600,(e.clientY-r.top)/r.height*600];};
  canvas.addEventListener('pointerdown',e=>{if(active)return;e.preventDefault();active=e.pointerId;canvas.setPointerCapture(active);strokes.push([point(e)]);onchange('start');draw();});
  canvas.addEventListener('pointermove',e=>{if(active!==e.pointerId)return;e.preventDefault();strokes.at(-1).push(point(e));draw();});
  function end(e){if(active!==e.pointerId)return;strokes.at(-1).push(point(e));active=null;draw();onchange('end');}
  canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',()=>{if(active!==null){strokes.pop();active=null;draw();onchange('end');}});draw();
  return{get:()=>strokes.map(s=>s.map(p=>p.slice())),clear:()=>{strokes=[];onchange();draw();},undo:()=>{strokes.pop();onchange();draw();}};
 }
 return{recognize,pad};
})();

<script>
(() => {

  ];

  let state = {version:1,unlocked:[]}, testMode = false, busy = false, ready = false;

  function readStorage(key) { try { return localStorage.getItem(key); } catch (_) { storageAvailable = false; return null; } }
  function writeStorage(key,value) { try { localStorage.setItem(key,value); } catch (_) { storageAvailable = false; } }
  function getToken() {
    let value = readStorage(storageKey);
    if (!/^[a-f0-9]{64}$/.test(value || '')) {
      if (!window.crypto?.getRandomValues) throw new Error('このブラウザでは端末キーを作れません。Safariで開いてください。');
      value = Array.from(crypto.getRandomValues(new Uint8Array(32)), b => b.toString(16).padStart(2,'0')).join('');
      writeStorage(storageKey,value);
    }
    return value;
  }

  function validState(s){return Engine.upgrade(s,Date.now());}
  const TownRules={shops:{},stageMs:86400000,harvestMs:259200000,day:Engine.day};
  function rpc(method,...args){return fetch('/api/rpc',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({method,args})}).then(async response=>{const value=await response.json();if(!response.ok)throw Error(value.error||'通信できませんでした。');return value;});
  }
  function statusText() {

  }
  function render() {

    for(const action of actions){const button=document.createElement('button');button.textContent=action.label;button.className=action.primary?'primary':'quiet';button.addEventListener('click',action.run);$('dialogActions').append(button);}
    if(!$('dialog').open)$('dialog').showModal();
  }
  function showShop(shop){
 const open=state.unlocked.includes(shop.id),can=state.development>=TownRules.shops[shop.id];const actions=[{label:'町にもどる',run:closeDialog}];if(!open&&can)actions.unshift({label:'森の向こうを開く',primary:true,run:()=>unlock(shop)});
 notice(open?shop.name+'は、ただいま準備中。':can?'森の向こうへ進めそう！':'この森の向こうには、何ができるのでしょうか。',!open&&can?{label:'森を開く',run:()=>unlock(shop)}:null);
 }
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  function toast(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,12000);}
  async function unlock(shop) {
    if(busy||state.unlocked.includes(shop.id))return;
    setBusy(true);$('dialogError').textContent='';$('saveStatus').textContent='町の記録を保存しています…';
    const node=$('plot-'+shop.id);
    try {
      const next=validState(await rpc('unlockShop',token,shop.id));
      $('dialog').close();
      // 保存成功後に演出開始。途中で画面を閉じても、次回は開放済みで復元されます。
      node.classList.add('animating');
      if(!reducedMotion.matches){
        node.classList.add('falling');await wait(850);
        node.querySelector('.smoke').classList.add('puff');await wait(280);
        node.classList.add('reveal');await wait(1050);
      }
      state=next;render();toast(shop.name+' がオープンしました！');nextStory();
      node.querySelector('button').disabled=false;node.querySelector('button').focus();
    } catch(error){notice(error.message);$('saveStatus').textContent='保存を確認できませんでした。もう一度お試しください。';}
    finally{node.classList.remove('animating','falling','reveal');node.querySelector('.smoke').classList.remove('puff');setBusy(false);}
  }
  function showDev() {
    if(!ready||busy||!testMode)return;
    showDialog({title:'町の開放テスト',eyebrow:'開発用 · 試作モード',text:'お店を選ぶと、開放演出を試せます。\n学習報酬・コインはまだ使いません。',actions:[{label:'最初の町にもどす',run:confirmReset},{label:'町にもどる',run:closeDialog}]});
    const list=document.createElement('div');list.className='shop-list';
    SHOPS.forEach((shop,i)=>{const button=document.createElement('button');button.textContent=state.unlocked.includes(shop.id)?'✓ '+shop.name:'＋ 森の向こう '+(i+1);button.addEventListener('click',()=>showShop(shop));list.append(button);});$('dialogExtra').append(list);
  }
  function confirmReset() {
    showDialog({title:'最初の町にもどしますか？',text:'この端末の試作の開放記録をリセットします。\n家と集会所だけの町から、もう一度演出を試せます。',actions:[{label:'リセットする',primary:true,run:async()=>{
      if(busy)return;setBusy(true);
      try{state=validState(await rpc('resetTown',token));render();$('dialog').close();toast('はじまりの町にもどりました。');}
      catch(e){$('dialogError').textContent=e.message;}finally{setBusy(false);}
    }},{label:'やめる',run:showDev}]});
  }
  function showHelp() {
    if(busy)return;
    showDialog({title:'町を、少しずつ育てよう。',eyebrow:'北小物語へようこそ',text:'建物や畑をタップすると、その場所を開けます。\n森の向こうには、６つのお店が待っています。',actions:[{label:'町にもどる',primary:true,run:closeDialog}]});
    const note=document.createElement('p');note.className='small-note';note.textContent='集会所で依頼を達成すると、町が少しずつ育ちます。畑の作物は現実の時間で成長します。iPadは横向きがおすすめです。';$('dialogExtra').append(note);const credit=document.createElement('p');credit.className='small-note';credit.textContent='手書きデータ: KanjiVG © Ulrich Apel · CC BY-SA 3.0（筆順データから候補を照合）';$('dialogExtra').append(credit);
  }
  function fixedRoom(title,text){
    if(!ready||busy)return;
    showDialog({title:title,eyebrow:'MY HOME',text:'家具を手に入れたら、床のマスを選んで置けるようになります。',actions:[{label:'町にもどる',primary:true,run:closeDialog}]});
    const room=document.createElement('section');room.className='home-room';
    const image=document.createElement('img');image.src=HOME_FARM_ASSETS.house;image.alt='自分の家の部屋';
    const grid=document.createElementNS('http://www.w3.org/2000/svg','svg');grid.classList.add('home-floor-grid');grid.setAttribute('viewBox','0 0 100 100');grid.setAttribute('preserveAspectRatio','none');grid.setAttribute('aria-label','家具を置く床');
    const floorPoint=(u,v)=>[49+44*u-43*v,34+28*u+28*v+6*u*v];
    for(let i=0;i<30;i++){
      const col=i%6,row=Math.floor(i/6),points=[floorPoint(col/6,row/5),floorPoint((col+1)/6,row/5),floorPoint((col+1)/6,(row+1)/5),floorPoint(col/6,(row+1)/5)];
      const tile=document.createElementNS('http://www.w3.org/2000/svg','polygon');tile.setAttribute('points',points.map(p=>p.join(',')).join(' '));tile.classList.add('home-floor-tile');tile.setAttribute('role','button');tile.setAttribute('tabindex','0');tile.setAttribute('aria-label',(col+1)+'列 '+(row+1)+'行');tile.onclick=()=>toast('家具ショップで家具を手に入れよう。');tile.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tile.onclick();}};grid.append(tile);
    }
    room.append(image,grid);$('dialogExtra').append(room);
  }
  function farmStage(plot){
    if(!plot)return {icon:'＋',label:'種を植える',ready:false};
    const age=gameNow()-plot.plantedAt;TownRules.stageMs=growthHours*3600000;TownRules.harvestMs=TownRules.stageMs*3;
    if(age<TownRules.stageMs)return {icon:'•',label:'土の中',ready:false};
    if(age<TownRules.stageMs*2)return {icon:'🌱',label:'芽が出た',ready:false};
    if(age<TownRules.harvestMs)return {icon:'🌿',label:'成長中',ready:false};
    return {icon:'🥕',label:'収穫する',ready:true};
  }
  function showFarm(){
    if(!ready||busy)return;
    showDialog({title:'わたしの畑',eyebrow:'MY GARDEN',text:'種を植えると、毎日少しずつ育ちます。',actions:[{label:'町にもどる',primary:true,run:closeDialog}]});
    const scene=document.createElement('section');scene.className='farm-scene';
    const image=document.createElement('img');image.src=HOME_FARM_ASSETS.farm;image.alt='わたしの畑';

      const stage=farmStage(plot),button=document.createElement('button');button.className='farm-plot farm-plot-'+index+(stage.ready?' ready':'');

  async function preload() {
    if(typeof ASSETS==='undefined')throw new Error('Assets.htmlの画像データがありません。Assetsの全文をscriptタグごと貼り付けてください。');
    const keys=['field','tree',...SHOPS.map(shop=>shop.id)];
    await Promise.all(keys.map(key=>new Promise((resolve,reject)=>{
      const src=ASSETS[key];
      if(typeof src!=='string'||!/^data:image\/(webp|png|jpeg);base64,[A-Za-z0-9+/]+=*$/.test(src)) {
        reject(new Error('Assets.htmlの '+key+' が不足、または途中で切れています。全文を貼り直してください。'));return;
      }
      const img=new Image();
      const timer=setTimeout(()=>{img.onload=null;img.onerror=null;reject(new Error('画像 '+key+' の読み込みが20秒で完了しませんでした。Assets.htmlを確認してください。'));},20000);
      img.onload=()=>{clearTimeout(timer);resolve();};
      img.onerror=()=>{clearTimeout(timer);reject(new Error('画像 '+key+' を表示できません。Assets.htmlを全文貼り直してください。'));};
      img.src=src;
    })));
  }
  let demoAccount=null;
  async function demoRpc(method,args){
    await new Promise(r=>setTimeout(r,80));const title={units:DEMO.units.map(([id,subject,name])=>({id,subject,name})),shops:DEMO.shops,dailyLimit:6,growthHours:24,serverTime:Date.now(),board:Engine.board,story:STORY_SEED};
    if(method==='getTitleData')return title;
    const accounts=JSON.parse(readStorage('kitakko.demo.accounts')||'{}');
    if(method==='bootstrap'){const raw=readStorage(demoKey);return{...title,state:raw?JSON.parse(raw):null};}
    if(method==='loginCharacter'||method==='registerCharacter'){
      const c=args[0],id=c.grade+'-'+c.group+'-'+c.number;if(!c.number||c.code.length!==1)throw Error('番号と絵を選んでください。');
      if(method==='registerCharacter'){if(accounts[id])throw Error('この番号は登録済みです。');if(!args[1]?.trim())throw Error('名前を入力してください。');const s=Engine.upgrade({},Date.now());s.id=crypto.randomUUID();s.name=args[1];s.accountId=id;s.appearance=args[3];accounts[id]={code:c.code[0],state:s};}
      const a=accounts[id];if(!a||a.code!==c.code[0])throw Error('組・番号・絵を確認してください。');demoAccount=id;writeStorage('kitakko.demo.accounts',JSON.stringify(accounts));return{...title,token:'demo-session',state:a.state};
    }
    const a=accounts[demoAccount];if(!a)throw Error('ログインしてください。');const s=Engine.upgrade(a.state,Date.now());let result=s;
    if(method==='selectAppearance'){if(!['a','b'].includes(args[1]))throw Error('見た目を選んでください。');if(!s.appearance)s.appearance=args[1];}

  const visualReady=new Set();
  const visualPending=new Map();
  function ensureVisualPack(name){
    if(visualReady.has(name))return Promise.resolve();
    if(visualPending.has(name))return visualPending.get(name);
    const pending=new Promise((resolve,reject)=>{
      const done=data=>{Object.assign(visualPacks[name],data);if(name==='NpcQuestAssets')Object.assign(EXTRA_ASSETS,data);visualReady.add(name);resolve();};
      if(!isGas){done(window.PREVIEW_VISUALS[name]);return;}
      const timer=setTimeout(()=>reject(Error('画像の読み込みが遅れています。もう一度開いてください。')),30000);
      google.script.run.withSuccessHandler(data=>{clearTimeout(timer);done(data);}).withFailureHandler(e=>{clearTimeout(timer);reject(Error(e.message||'画像を読み込めませんでした。'));}).getVisualAssets(name);
    }).catch(e=>{visualPending.delete(name);throw e;});
    visualPending.set(name,pending);return pending;
  }
  function withVisuals(fn,names){return async function(...args){
    const needed=typeof names==='function'?names(...args):names;
    if(needed.every(n=>visualReady.has(n)))return fn(...args);
    const oldBusy=busy;setBusy(true);const message=document.createElement('div');message.className='visual-loading';message.setAttribute('role','status');message.textContent='画面を読み込んでいます…';document.body.append(message);
    try{await Promise.all(needed.map(ensureVisualPack));setBusy(oldBusy);return fn(...args);}catch(e){setBusy(oldBusy);notice(e.message);}finally{message.remove();}
  };}
  talk=withVisuals(talk,(lines,done,title='')=>{
    const names=['ExtraAssets'];if(lines.some(l=>QUEST_NPCS.some(n=>n[0]===l[0])))names.push('NpcQuestAssets');
    if(/^第一章　/.test(title)&&title!=='第一章　ノースタウン')names.push('MemoryAssets');return names;
  });
  fixedRoom=withVisuals(fixedRoom,['HomeFarmAssets','FurnitureAssets']);
  showFarm=withVisuals(showFarm,['HomeFarmAssets']);
  showBoard=withVisuals(showBoard,['ExtraAssets']);
  showFurnitureShop=withVisuals(showFurnitureShop,['FurnitureAssets','ExtraAssets']);
  showAlchemy=withVisuals(showAlchemy,['AlchemyAssets']);
  showOtomoShop=withVisuals(showOtomoShop,['OtomoAssets']);

  const emoji=['🐱','🐶','🐰','🐻','🌸','⭐','🍎','🚀'];let selectedEmoji=null,legacyToken=null,selectedAppearance=null;
  const credentials=()=>({grade:Number($('loginGrade').value),group:Number($('loginGroup').value),number:Number($('loginNumber').value),code:selectedEmoji===null?[]:[selectedEmoji]});
  emoji.forEach((symbol,i)=>{const b=button(symbol,()=>{selectedEmoji=i;document.querySelectorAll('.emoji-choice').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));},'emoji-choice');b.setAttribute('aria-label',symbol);b.setAttribute('aria-pressed','false');$('emojiChoices').append(b);});
  function applyBoot(result){serverOffset=(result.serverTime||Date.now())-Date.now();courses=result.units||[];board=result.board||Engine.board;storyData=result.story||STORY_SEED;Object.assign(TownRules.shops,result.shops||{});growthHours=result.growthHours||24;if(result.state)state=validState(result.state);}
  async function authenticate(register){
    if(!loaded||busy)return;if(selectedEmoji===null){$('titleStatus').textContent='合い言葉の絵を１つ選んでね。';return;}
    setBusy(true);$('titleStatus').textContent='町の画像を準備しています…';
    try{
      await Promise.all(['Assets','CharacterAssets'].map(ensureVisualPack));
      $('field').src=ASSETS.field;$('titleStatus').textContent=register?'セーブデータを作成中…':'セーブデータを読み込んでいます…';
      const r=register?await rpc('registerCharacter',credentials(),$('playerName').value,legacyToken,selectedAppearance):await rpc('loginCharacter',credentials());
      token=r.token;applyBoot(r);legacyToken=null;setBusy(false);$('appearanceDialog').close();
      if(!state.appearance){chooseAppearance(async id=>{setBusy(true);try{state=validState(await rpc('selectAppearance',token,id));$('appearanceDialog').close();enterTown();}finally{setBusy(false);}});}else enterTown();
    }catch(e){$('titleStatus').textContent=e.message;$('appearanceError').textContent=e.message;}finally{setBusy(false);}
  }
  function init(){
    if(busy)return;ready=false;
    // The login form needs no spreadsheet reads or decoding of every shop image.
    loaded=true;boot.finished=true;boot.started=true;$('loading').hidden=true;
    $('titleRetry').hidden=true;titleMenu();$('newBtn').disabled=false;$('continueBtn').disabled=false;
    // Preserve migration of an old local town without a blocking bootstrap request.
    const old=readStorage(storageKey);legacyToken=/^[a-f0-9]{64}$/.test(old||'')?old:null;
  }

  let loginMode=null;
  function titleMenu(){loginMode=null;$('loginPanel').hidden=true;$('titleChoices').hidden=false;$('titleStatus').textContent='';}
  function showLogin(mode){if(!loaded||busy)return;loginMode=mode;$('titleChoices').hidden=true;$('loginPanel').hidden=false;$('nameArea').hidden=mode!=='new';$('passwordNotice').hidden=mode!=='new';$('loginSubmit').textContent=mode==='new'?'見た目を選ぶ':'ログイン';$('titleStatus').textContent='';}
  $('newBtn').onclick=()=>showLogin('new');$('continueBtn').onclick=()=>showLogin('continue');
  $('loginBack').onclick=()=>{if(!busy)titleMenu();};
  $('loginSubmit').onclick=()=>{if(!loaded||busy)return;const c=credentials();if(!Number.isInteger(c.group)||c.group<1||c.group>20||!Number.isInteger(c.number)||c.number<1||c.number>99||selectedEmoji===null){$('titleStatus').textContent='組・番号と、合い言葉の絵を確認してね。';return;}if(loginMode==='new'){const name=$('playerName').value.trim();if(!/^[ぁ-ゖァ-ヺ一-龯ー]{1,6}$/.test(name)){$('titleStatus').textContent='名前は、ひらがな・カタカナ・漢字だけで6文字以内にしてね。';return;}chooseAppearance(()=>authenticate(true));}else if(loginMode==='continue')authenticate(false);};
  $('titleRetry').onclick=init;$('retryBtn').onclick=init;
  $('logoutBtn').onclick=()=>{if(busy||travelling||storyPlaying)return;ready=false;state=null;token=null;selectedEmoji=null;selectedAppearance=null;$('loginGroup').value='';$('loginNumber').value='';$('playerName').value='';document.querySelectorAll('.emoji-choice').forEach(b=>b.setAttribute('aria-pressed','false'));$('titleScreen').hidden=false;titleMenu();};
  init();


})();
</script>
</body>
</html>
