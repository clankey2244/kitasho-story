<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>北小物語 管理画面</title><style>
body{margin:0;background:#eef2e8;color:#24382e;font-family:"Yu Gothic",sans-serif}main{width:min(1180px,94vw);margin:28px auto}.card{background:#fffdf4;border-radius:18px;padding:24px;box-shadow:0 8px 28px #28452c20}h1{margin-top:0}input,select,button{font:inherit;padding:11px 13px;border:1px solid #b8c6ae;border-radius:10px}button{background:#2d6248;color:#fff;font-weight:700;cursor:pointer}.quiet{background:#fff;color:#315b45}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.toolbar input{min-width:240px}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:10px 8px;border-bottom:1px solid #dde4d7;text-align:left;white-space:nowrap}th{background:#e7efdf;position:sticky;top:0}.table-wrap{overflow:auto;max-height:68vh}.actions{display:flex;gap:6px}.actions button{padding:7px 9px;font-size:13px}#status{min-height:1.5em;color:#8a3e34}.login{max-width:480px;margin:12vh auto}.badge{display:inline-block;padding:3px 8px;border-radius:20px;background:#edf4dc}@media(max-width:700px){th,td{font-size:12px;padding:8px 5px}.card{padding:14px}}
</style></head><body><main><section id="login" class="card login"><h1>北小物語 管理画面</h1><p>先生用の管理者パスワードを入力してください。</p><div class="toolbar"><input id="password" type="password" autocomplete="current-password"><button id="loginButton">ログイン</button></div><p id="loginError"></p></section><section id="panel" class="card" hidden><h1>児童のセーブデータ</h1><div class="toolbar"><input id="search" placeholder="名前・学年-組-番号"><button id="searchButton">検索</button><button id="reload" class="quiet">更新</button><a href="/"><button class="quiet">ゲームへ</button></a></div><p id="status"></p><div class="table-wrap"><table><thead><tr><th>学年-組-番号</th><th>名前</th><th>LV</th><th>経験値</th><th>コイン</th><th>発展度</th><th>開放店</th><th>最終ログイン</th><th>最終保存</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
const $=id=>document.getElementById(id),icons=['🐱','🐶','🐰','🐻','🌸','⭐','🍎','🚀'];let token=sessionStorage.getItem('kitakko.admin')||'';
const date=n=>n?new Date(n).toLocaleString('ja-JP'):'—';async function api(path,options={}){const r=await fetch(path,{...options,headers:{'content-type':'application/json',authorization:'Bearer '+token,...options.headers}}),v=await r.json().catch(()=>({}));if(!r.ok)throw Error(v.error||'通信できませんでした。');return v;}
async function load(){try{const q=$('search').value.trim(),data=await api('/api/admin/players?q='+encodeURIComponent(q));$('rows').replaceChildren(...data.players.map(p=>{const tr=document.createElement('tr');tr.innerHTML=`<td><span class="badge">${p.account_id}</span></td><td>${p.name}</td><td>${p.level}</td><td>${p.xp}</td><td>${p.coins}</td><td>${p.development}</td><td>${p.unlocked_count}</td><td>${date(p.last_login)}</td><td>${date(p.updated_at)}</td><td class="actions"></td>`;const actions=tr.lastElementChild,reset=document.createElement('button'),revoke=document.createElement('button'),save=document.createElement('button');reset.textContent='合い言葉変更';reset.onclick=async()=>{const choice=prompt('新しい絵の番号を入力してください。\n'+icons.map((x,i)=>i+'：'+x).join('　'));if(choice===null)return;await api('/api/admin/players/'+p.id+'/reset-passphrase',{method:'POST',body:JSON.stringify({code:Number(choice)})});alert('合い言葉を '+icons[Number(choice)]+' に変更しました。児童へ伝えてください。');};revoke.textContent='ログアウト';revoke.className='quiet';revoke.onclick=async()=>{await api('/api/admin/players/'+p.id+'/revoke-sessions',{method:'POST'});alert('ログイン中の端末を解除しました。');};save.textContent='保存取得';save.className='quiet';save.onclick=()=>{location.href='/api/admin/players/'+p.id+'/export?token='+encodeURIComponent(token)};actions.append(reset,revoke,save);return tr;}));$('status').textContent=data.players.length+'人を表示しています。';}catch(e){$('status').textContent=e.message;if(/ログイン/.test(e.message)){token='';sessionStorage.removeItem('kitakko.admin');$('panel').hidden=true;$('login').hidden=false;}}}
$('loginButton').onclick=async()=>{try{const data=await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('password').value})});token=data.token;sessionStorage.setItem('kitakko.admin',token);$('login').hidden=true;$('panel').hidden=false;load();}catch(e){$('loginError').textContent=e.message;}};$('searchButton').onclick=load;$('reload').onclick=load;$('search').onkeydown=e=>{if(e.key==='Enter')load();};if(token){$('login').hidden=true;$('panel').hidden=false;load();}
</script></body></html>
